name: RoleRadar quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements.txt
      - name: Install JavaScript dependencies
        run: pnpm install
      - name: Install Python dependencies
        run: |
          python -m venv apps/ai-service/.venv
          apps/ai-service/.venv/bin/pip install -r apps/ai-service/requirements.txt
      - name: Run quality gates
        run: pnpm quality
      - name: Verify every file is within 300 lines
        run: pnpm check:lines
